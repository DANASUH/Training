<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Contact Form</title>
</head>
<body>

    <h1>Exercise 3: Contact Form</h1>
    
    <form action="#">
        
        <p>
            <label for="username">Full Name:</label>
            <input type="text" id="username" placeholder="Enter your name" required>
        </p>

        <p>
            <label for="useremail">Email Address:</label>
            <input type="email" id="useremail" placeholder="dana@example.com" required>
        </p>

        <p>
            <label for="userpass">Password:</label>
            <input type="password" id="userpass" required>
        </p>

        <p>
            <label for="taskdate"> Date:</label>
            <input type="date" id="taskdate">
        </p>

        <p>
            <label for="select">Select:</label>
            <select id="select">
                <option>Web Development</option>
                <option>Cyber Security</option>
                <option>Machine Learning</option>
            </select>
        </p>

        <p>
            <label for="notes">Notes / Message:</label><br>
            <textarea id="notes" placeholder="Write your notes here..."></textarea>
        </p>

        <p>
            <input type="checkbox" id="confirm" required>
            <label for="confirm">I agree to the terms and conditions</label>
        </p>

        <button type="submit">Submit Form</button>

    </form>

</body>
</html>
